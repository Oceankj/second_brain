services:
  db:
    image: pgvector/pgvector:pg16
    container_name: personal-agent-memory-postgres
    environment:
      POSTGRES_DB: ${LOCAL_POSTGRES_DB:-personal_agent_memory}
      POSTGRES_USER: ${LOCAL_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:-postgres}
    ports:
      - "${LOCAL_POSTGRES_PORT:-5432}:5432"
    volumes:
      - personal_agent_memory_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${LOCAL_POSTGRES_USER:-postgres} -d ${LOCAL_POSTGRES_DB:-personal_agent_memory}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  ollama:
    image: ollama/ollama:latest
    container_name: personal-agent-memory-ollama
    ports:
      - "11434:11434"
    volumes:
      - personal_agent_memory_ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 24

  ollama-pull:
    image: ollama/ollama:latest
    container_name: personal-agent-memory-ollama-pull
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${OLLAMA_EMBEDDING_MODEL:-qwen3-embedding:0.6b}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

volumes:
  personal_agent_memory_pgdata:
  personal_agent_memory_ollama:
