services:
  db:
    image: pgvector/pgvector:pg16
    container_name: personal-agent-memory-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-personal_agent_memory}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - personal_agent_memory_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-personal_agent_memory}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  personal_agent_memory_pgdata:
